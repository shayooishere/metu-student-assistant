[theme]

base = "light"
primaryColor = "#E31837"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#1A1A1A"
linkColor = "#E31837"
borderColor = "#D0D0D0"
font = "sans serif"

# Light mode
[theme.light]
primaryColor = "#E31837"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#1A1A1A"
linkColor = "#E31837"
borderColor = "#D0D0D0"

# Dark mode 
[theme.dark]
primaryColor = "#E31837"
backgroundColor = "#1A1A1A"
secondaryBackgroundColor = "#2A2A2A"
textColor = "#F5F5F5"
linkColor = "#FF4D6A"
borderColor = "#444444"
